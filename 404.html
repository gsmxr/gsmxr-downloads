content="noindex,nofollow,noarchive,nosnippet">

<meta name="googlebot"
content="noindex,nofollow,noarchive,nosnippet">

<!--
Invisible tab title.
Visible text नहीं रखा गया.
-->
<title>​</title>


<!-- SAME DOWNLOAD ICON -->

<link
rel="icon"
type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='60' height='60' rx='16' fill='url(%23g)'/%3E%3Cpath d='M32 13v25m0 0-10-10m10 10 10-10M18 48h28' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">


<style>

html,
body{

margin:0;

padding:0;

width:100%;

height:100%;

background:#ffffff;

overflow:hidden;

}


/*
Page पर कोई text / branding नहीं.
*/

body{

font-size:0;

color:transparent;

}

</style>

</head>


<body>


<!--
Actual GitHub file hidden frame में load होगी.
-->

<iframe
id="downloadFrame"
style="display:none"
aria-hidden="true">
</iframe>


<script>

(function(){


/*
Example:

https://tool.gsmxr.com/RMX-OTP-V5.zip

pathname:

/RMX-OTP-V5.zip
*/

const rawPath =
window.location.pathname;


let fileName = "";


try{

fileName =
decodeURIComponent(
rawPath
)
.replace(
/^\/+|\/+$/g,
""
);

}

catch(error){

fileName =
rawPath
.replace(
/^\/+|\/+$/g,
""
);

}


/*
Invalid request होने पर
कुछ नहीं करना.
*/

if(

!fileName

||

fileName.toLowerCase() ===
"404.html"

){

return;

}


/*
Actual GitHub Release location
*/

const githubBase =

"https://github.com/gsmxr/gsmxr-downloads/releases/download/downloads/";



const githubDownloadURL =

githubBase +

encodeURIComponent(
fileName
);



/*
Actual file hidden iframe में load होगी.

Page पर:
- कोई GSMXR text नहीं
- कोई filename title नहीं
- सिर्फ favicon/tab icon
*/

const frame =

document.getElementById(
"downloadFrame"
);



setTimeout(

function(){


frame.src =

githubDownloadURL;


},

60

);


})();

</script>


</body>

</html>
